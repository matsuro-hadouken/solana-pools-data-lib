[package]
name = "solana-pools-data-lib"
version = "0.3.0"
edition = "2021"
authors = ["matsuro-hadouken"]
description = "Rust library for fetching Solana stake pool data with production and debug output formats"
license = "MIT"
repository = "https://github.com/matsuro-hadouken/solana-pools-data-lib"
documentation = "https://docs.rs/solana-pools-data-lib"
keywords = ["solana", "blockchain", "stake-pools", "rpc", "defi"]
categories = ["api-bindings", "cryptocurrency", "asynchronous"]
readme = "README.md"
# Verified by compilation, not by reading declared MSRVs: 1.81 fails on the
# icu_* crates (reqwest -> url -> idna), 1.82 builds clean. The `discover`
# feature builds on the same 1.82 since dropping solana-pubkey.
rust-version = "1.82"
exclude = ["/target", "/.git", "/.github"]

[features]
default = []
discover = ["dep:curve25519-dalek", "dep:sha2", "dep:bs58", "dep:toml"]

[lib]
name = "solana_pools_data_lib"

[[bin]]
name = "pools-data-demo"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12.24", features = ["json"] }
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
governor = "0.10"
nonzero_ext = "0.3"
tokio-retry = "0.3"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.0"

# generator-only; never built unless `discover` is enabled
# Generator-only. solana-pubkey was used for exactly one thing worth depending
# on: create_program_address's off-curve check. It pulled 43 crates and forced
# the feature to Rust 1.89 via solana-address/solana-hash. These three do the
# same job in ~13 crates, none of them solana, and drop the feature floor to
# the library's own.
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables"], optional = true }
sha2 = { version = "0.10", optional = true }
bs58 = { version = "0.5", optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
env_logger = "0.11"
tokio-test = "0.4"

[[example]]
name = "discover_pools"
required-features = ["discover"]
# Cargo defaults example targets to test = false, so the policy tests inside
# this file (base64 decoder, the stale-recheck asymmetry, credential scrubbing
# in endpoint_label, verify_cohort withholding) never ran under `cargo test`.
# There is no CI, so `cargo test` is the only gate that exists.
test = true
